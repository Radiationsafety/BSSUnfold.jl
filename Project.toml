name = "BSSUnfold"
uuid = "7c4f9e3a-2b8d-4f1e-9c5b-8a1d6e3f0c2a"
version = "0.5.1"
authors = ["Konstantin Chizhov <kchizhov@jinr.ru>", "Z.ai <dev@z.ai>"]

[deps]
Convex = "f65535da-76fb-5f13-bab9-19810c17039a"
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
OSQP = "ab2f91bb-94b4-55e3-9ba0-7f65df51de79"
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SCS = "c946c3f1-0d1f-5ce8-9dea-7daa1f7e2d13"
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

[compat]
Convex = "0.16.7"
DelimitedFiles = "1.9.1"
# SeaPearl 0.4.x pins JSON 0.21.x, so a shared Julia session (BSSUnfold +
# SeaPearl) must accept 0.21.4; without SeaPearl the resolver picks 1.8.x.
JSON = "0.21.4 - 1"
OSQP = "0.8.1"
Plots = "1.41.7"
SCS = "2.6.5"
Printf = "1"
Random = "1"
SparseArrays = "1"
Statistics = "1"
julia = "1.10"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test"]

# Julia 1.10 single-session support for the SeaPearl-CSP method:
# SeaPearl upstream (0.4.x) declares julia = "1.8 - 1.9" and pins JSON 0.21,
# so it cannot simply live in [extras] on Julia 1.10 (Pkg.test would resolve
# it from the registry and fail). Instead, examples/seapearl_training ships a
# ready-made Project.toml with [sources] pointing at the compat fork
# (Radiationsafety/SeaPearl.jl, branch compat/julia-1.10) and at the
# GPUCompiler v0.17.3 tag — instantiate it and CP + RL run in one session
# alongside BSSUnfold. See README.md and examples/README.md.
