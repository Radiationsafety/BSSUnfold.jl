# Publish: автоматическая регистрация в General registry через Registrator
name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Verify Project.toml version matches tag
        run: |
          TAG="${GITHUB_REF##*/}"
          PROJECT_VERSION=$(grep '^version' Project.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "v$PROJECT_VERSION" != "$TAG" ]; then
            echo "ERROR: Tag $TAG does not match Project.toml version v$PROJECT_VERSION"
            exit 1
          fi
          echo "Version OK: $TAG"
      - name: Trigger Registrator
        uses: julia-actions/Registrator@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_BRANCH: master
